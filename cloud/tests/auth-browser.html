<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker · Synthetic Auth QA</title>
<link rel="stylesheet" href="/css/style.css">
<main id="main"><h1>Auth QA · dữ liệu giả · KHÔNG gọi Supabase</h1><p>Transport dưới đây là fixture local. Không nhập email hoặc mã thật.</p>
<label>Calories chưa lưu <input name="fixtureCalories" value="1777" inputmode="numeric"></label>
<label><input id="pending" type="checkbox"> Phần đang soạn giả</label>
<button id="expire" type="button">Giả lập hết hạn</button><button id="error" type="button">Lỗi request kế tiếp</button><pre id="qa" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></main>
<script type="module">
import { createSupabaseAuthAdapter, createCloudAuth } from '/js/cloud-auth.js';
import { createCloudAuthUI } from '/js/cloud-auth-ui.js';
const calls = []; let failNext = false; let email = '';
const uid = '11111111-1111-4111-8111-111111111111', second = '22222222-2222-4222-8222-222222222222';
const adapter = createSupabaseAuthAdapter({config:{enabled:true,environment:'preview',projectUrl:'https://syntheticproject.supabase.co',publishableKey:'sb_publishable_synthetic'},fetchImpl:async(url, options)=>{
  const path = new URL(url).pathname; calls.push({path,method:options.method});
  const body = options.body ? JSON.parse(options.body) : {};
  if(body.email) email=body.email;
  if(failNext){failNext=false;return {ok:false,status:500,json:async()=>({message:'PRIVATE PROVIDER BODY'})};}
  if(path.endsWith('/logout'))return {ok:true,status:204};
  if(path.endsWith('/user'))return {ok:true,status:200,json:async()=>({id:email.startsWith('second')?second:uid,role:'authenticated',aud:'authenticated',email,email_confirmed_at:'2026-10-08',is_anonymous:false})};
  return {ok:true,status:200,json:async()=>path.endsWith('/otp')?{}:{access_token:'synthetic-access',refresh_token:'synthetic-refresh',token_type:'bearer',expires_in:3600}};
}});
const auth=createCloudAuth({adapter,getPendingWork:()=>document.querySelector('#pending').checked?document.querySelector('[name=fixtureCalories]').value:null});
const node=(tag,attrs={},children=[])=>{const el=document.createElement(tag);for(const [key,value]of Object.entries(attrs)){if(key==='text')el.textContent=value;else if(key==='onClick')el.addEventListener('click',value);else if(key==='value')el.value=value;else el.setAttribute(key,value);}el.append(...children);return el;};
const helpers={node,button:(text,fn)=>node('button',{type:'button',text,onClick:fn}),p:(text,cls)=>node('p',{text,class:cls||''}),h2:text=>node('h2',{text}),div:(cls,...children)=>node('div',{class:cls},children),panel:(...children)=>node('section',{class:'panel'},children),field:(label,name,value,options)=>node('label',{},[node('span',{text:label}),node('input',{name,value,...options})])};
document.querySelector('#main').append(createCloudAuthUI({auth,helpers}).mount());
function report(){document.querySelector('#qa').textContent=JSON.stringify({state:auth.read(),calls,fixtureCalories:document.querySelector('[name=fixtureCalories]').value},null,2);}
auth.subscribe(report);document.querySelector('#expire').onclick=()=>{auth.expire();report();};document.querySelector('#error').onclick=()=>{failNext=true;};report();
</script></html>
