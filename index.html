<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdfbf7">
  <title>Tracker</title>
  <link rel="stylesheet" href="css/style.css?v=31">
  <script type="module" src="js/app.js?v=31"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">T</span><strong>Tracker</strong></div>
      <nav class="primary-nav" aria-label="Điều hướng chính">
        <button type="button" data-view="dashboard" data-group="today" aria-current="page">Hôm nay</button>
        <button type="button" data-view="program" data-group="training">Gym</button>
        <button type="button" data-view="nutrition" data-group="food">Dinh dưỡng</button>
        <button type="button" data-view="journal" data-group="journal">Nhật ký & Ảnh</button>
        <button type="button" data-view="checkins" data-group="progress">Tiến độ</button>
        <button type="button" data-view="settings" data-group="settings">Cài đặt & sao lưu</button>
      </nav>
      <p class="sidebar-note">Dữ liệu lưu trên trình duyệt này.<br>Hãy xuất bản sao lưu định kỳ.</p>
    </aside>
    <div class="app-content">
      <header class="topbar">
        <div><button type="button" class="home-link" data-view="dashboard" data-group="today">TRACKER · VỀ TRANG CHỦ</button><h1 id="view-title">Hôm nay</h1></div>
        <span class="local-badge">Dữ liệu trên thiết bị</span>
      </header>
      <nav id="training-nav" class="subtabs" aria-label="Mục tập luyện" hidden>
        <button type="button" data-view="program" data-subview="program">Gym hôm nay</button>
        <button type="button" data-view="plans" data-subview="plans">Kế hoạch</button>
        <button type="button" data-view="exercise-library" data-subview="exercise-library">Thư viện bài</button>
        <button type="button" data-view="builder" data-subview="builder">Tạo buổi</button>
        <button type="button" data-view="workout" data-subview="workout">Buổi đang tập</button>
        <button type="button" data-view="history" data-subview="history">Lịch sử</button>
        <button type="button" data-view="gym-logs" data-subview="gym-logs">Cardio & gối</button>
      </nav>
      <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
      <main id="main" tabindex="-1"></main>
      <footer>Kế hoạch tập gốc: tài liệu riêng · Dữ liệu lưu trong trình duyệt; hãy xuất bản sao lưu thường xuyên.</footer>
      <nav class="mobile-nav" aria-label="Điều hướng mobile">
        <button type="button" data-view="program" data-group="training"><span aria-hidden="true">▰</span>Gym</button>
        <button type="button" data-view="nutrition" data-group="food"><span aria-hidden="true">◉</span>Dinh dưỡng</button>
        <button type="button" data-view="journal" data-group="journal"><span aria-hidden="true">✎</span>Nhật ký</button>
        <button type="button" data-view="checkins" data-group="progress"><span aria-hidden="true">↗</span>Tiến độ</button>
        <button type="button" data-view="settings" data-group="settings"><span aria-hidden="true">⚙</span>Cài đặt</button>
      </nav>
    </div>
  </div>
</body>
</html>
